; Limites de subida para el servidor de desarrollo de HABBI.
;
; Se carga via PHP_INI_SCAN_DIR desde deploy/probar-local.sh. Los valores
; por defecto de PHP (post_max_size 8M, upload_max_filesize 2M) impiden
; subir varias fotos a la vez, que es justo lo que hace el formulario de
; publicar. Esto NO afecta al PHP del sistema: solo al servidor local.

post_max_size = 64M
upload_max_filesize = 16M
max_file_uploads = 20
memory_limit = 512M
